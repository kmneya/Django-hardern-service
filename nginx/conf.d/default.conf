# 1. HTTP Server Block: Redirect all plain HTTP to HTTPS (Bonus points!)
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server Block: The Secure Lock
server {
    listen 443 ssl;
    server_name localhost;

    # Paths to the certificates we mounted into the container
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Strong TLS/SSL settings (Security Best Practice for the report)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Add security headers (Defense in depth, mirroring Django settings)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # Serve static files directly
    location /static/ {
        alias /app/staticfiles/;
    }


    # Send all traffic to our Django app container
    location / {
        proxy_pass http://app:8000;
        
        # Pass the original protocol and host so Django knows it's secure
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}